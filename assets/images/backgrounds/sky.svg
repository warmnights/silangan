<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <title>Sky</title>
  <style>
    .star {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 4s ease-in-out infinite;
    }
    .s2 { animation-duration: 5.5s; animation-delay: -1.2s; }
    .s3 { animation-duration: 3.2s; animation-delay: -2.4s; }
    .s4 { animation-delay: -3.3s; }

    .bird { opacity: 0.7; animation: fly 46s linear infinite; }
    .bird-2 { animation-duration: 62s; animation-delay: -24s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.6); }
      50%      { opacity: 0.9;  transform: scale(1.2); }
    }
    @keyframes fly {
      from { transform: translate(-80px, 0); }
      50%  { transform: translate(600px, -40px); }
      to   { transform: translate(1300px, 10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .star, .bird { animation: none; }
    }
  </style>
  <defs>
    <path id="spark" d="M0-7 1.8-1.8 7 0 1.8 1.8 0 7-1.8 1.8-7 0-1.8-1.8Z"/>
  </defs>

  <g fill="#60241E">
    <use href="#spark" class="star"      x="120"  y="170"/>
    <use href="#spark" class="star s2"   x="330"  y="90"/>
    <use href="#spark" class="star s3"   x="520"  y="200"/>
    <use href="#spark" class="star s4"   x="690"  y="70"/>
    <use href="#spark" class="star s2"   x="880"  y="150"/>
    <use href="#spark" class="star s3"   x="1080" y="90"/>
    <use href="#spark" class="star s4"   x="240"  y="330"/>
    <use href="#spark" class="star"      x="1120" y="300"/>
  </g>

  <g fill="none" stroke="#60241E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(0 130)">
      <g class="bird bird-1"><path d="M0 0q9-9 18 0q9-9 18 0"/></g>
    </g>
    <g transform="translate(0 190) scale(.7)">
      <g class="bird bird-2"><path d="M0 0q9-9 18 0q9-9 18 0"/></g>
    </g>
  </g></svg>
