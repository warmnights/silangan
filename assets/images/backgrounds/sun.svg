<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Sun</title>
  <defs>
    <!-- Top-right quadrant rays -->
    <g id="quadrant">
      <polygon points="590,80 620,116 572,300 551,300"/>
      <polygon points="873,150 868,225 681,374 647,341 797,153"/>
      <polygon points="762,151 715,156 614,325 631,335"/>
      <polygon points="873,262 868,308 697,407 687,392"/>
      <polygon points="907,404 944,432 720,470 716,450"/>
    </g>
    <!-- Main cardinal ray (top) -->
    <polygon id="main" points="511,0 561,56 535,300 488,300 460,56"/>
  </defs>
  <g fill="#8E2F3C">
    <circle cx="512" cy="512" r="241"/>
    <use href="#quadrant"/>
    <use href="#quadrant" transform="translate(1024,0) scale(-1,1)"/>
    <use href="#quadrant" transform="translate(0,1024) scale(1,-1)"/>
    <use href="#quadrant" transform="translate(1024,1024) scale(-1,-1)"/>
    <use href="#main"/>
    <use href="#main" transform="rotate(90 512 512)"/>
    <use href="#main" transform="rotate(180 512 512)"/>
    <use href="#main" transform="rotate(270 512 512)"/>
  </g></svg>
